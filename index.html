<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry 😭❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(-45deg, #1a1a1a, #2b2b2b, #ff4d6d, #1a1a1a);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* canvas */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* hearts */
.heart {
  position: absolute;
  font-size: 18px;
  animation: float 6s linear infinite;
  opacity: 0.6;
}
@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* mosquito */
.mosquito {
  position: absolute;
  width: 100px;
  height: 100px;
  transition: 1.5s linear;
  z-index: 2;
}

.face {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  position: absolute;
  top: 18px;
  left: 25px;
  z-index: 2;
}

.body {
  width: 10px;
  height: 50px;
  background: #222;
  position: absolute;
  top: 35px;
  left: 45px;
  border-radius: 10px;
}

.leg {
  width: 35px;
  height: 2px;
  background: #222;
  position: absolute;
}

.l1 { top: 50px; left: 0; transform: rotate(30deg); }
.l2 { top: 60px; left: 0; transform: rotate(10deg); }
.l3 { top: 70px; left: 0; transform: rotate(-10deg); }

.r1 { top: 50px; right: 0; transform: rotate(-30deg); }
.r2 { top: 60px; right: 0; transform: rotate(-10deg); }
.r3 { top: 70px; right: 0; transform: rotate(10deg); }

/* wings */
.wing {
  width: 40px;
  height: 18px;
  background: rgba(255,255,255,0.3);
  position: absolute;
  top: 8px;
  border-radius: 50%;
  animation: flap 0.15s infinite alternate;
}
.wing.left { left: 0; }
.wing.right { right: 0; }

@keyframes flap {
  from { transform: rotate(0deg); }
  to { transform: rotate(15deg); }
}

/* UI */
.container {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  
  width: 90%;
  max-width: 360px;

  backdrop-filter: blur(20px);
  background: rgba(0, 0, 0, 0.75);

  padding: 18px;
  border-radius: 20px;
  text-align: center;

  color: white;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);

  z-index: 2;
}

/* button */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg, #ff4d6d, #ff85a1);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,77,109,0.6);
  transition: 0.3s;
}
button:hover { transform: scale(1.05); }

/* message */
#msg { display: none; margin-top: 10px; }

#msg b {
  color: #ff4d6d;
  text-shadow: 0 0 10px #ff4d6d;
}

/* confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 2s linear forwards;
}
@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>

</head>

<body>

<canvas id="bg"></canvas>

<script>
/* PARTICLES */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2 + 1,
    dx: (Math.random()-0.5)*0.5,
    dy: (Math.random()-0.5)*0.5
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255, 77, 109, 0.6)";
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0||p.x>canvas.width) p.dx *= -1;
    if(p.y<0||p.y>canvas.height) p.dy *= -1;
  }

  requestAnimationFrame(draw);
}
draw();

/* hearts */
for(let i=0;i<20;i++){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random()*100 + "vw";
  h.style.fontSize = (14 + Math.random()*18) + "px";
  h.style.animationDuration = (4 + Math.random()*4) + "s";
  document.body.appendChild(h);
}
</script>

<!-- MOSQUITO -->

<div class="mosquito" id="mosquito">
  <div class="wing left"></div>
  <div class="wing right"></div>
  <div class="body"></div>

  <div class="leg l1"></div>
  <div class="leg l2"></div>
  <div class="leg l3"></div>
  <div class="leg r1"></div>
  <div class="leg r2"></div>
  <div class="leg r3"></div>

  <img src="me.jpg" class="face">
</div>

<!-- UI -->

<div class="container">
  <h2>Catch me first 😭🦟</h2>
  <button onclick="show()">I caught you 😤</button>

  <div id="msg">
    <p>Okay fine… you caught me 😭</p>
    <p>I know I’ve been low effort…</p>
    <p>But you really mean a lot to me.</p>
    <p>I’ll do better, I promise ❤️</p>
    <p><b>Please forgive me 🥺</b></p>
  </div>
</div>

<script>
const mosquito = document.getElementById("mosquito");

let prevX = 0;
let prevY = 0;

/* movement optimized */
function moveMosquito(){
  let margin = 100;

  let x = Math.random() * (window.innerWidth - margin);
  let y = Math.random() * (window.innerHeight - margin);

  let dx = x - prevX;
  let dy = y - prevY;
  let angle = Math.atan2(dy, dx) * (180 / Math.PI);

  mosquito.style.left = x + "px";
  mosquito.style.top = y + "px";
  mosquito.style.transform = "rotate(" + angle + "deg)";

  prevX = x;
  prevY = y;
}

/* slower on mobile */
let speed = window.innerWidth < 768 ? 2200 : 1500;
setInterval(moveMosquito, speed);

/* apology */
function show(){
  document.getElementById("msg").style.display = "block";

  for(let i=0;i<60;i++){
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = `hsl(${Math.random()*360},100%,70%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
</script>

</body>
</html>
