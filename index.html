<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry 😭❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;

  background: linear-gradient(-45deg, #ff6a88, #ff99ac, #ff758c, #ffb3c6);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* floating hearts */
.heart {
  position: absolute;
  font-size: 18px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* mosquito */
.mosquito {
  position: absolute;
  width: 120px;
  height: 120px;
  transition: 1.5s linear;
}

.face {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  position: absolute;
  top: 20px;
  left: 30px;
  z-index: 2;
}

.body {
  width: 12px;
  height: 60px;
  background: black;
  position: absolute;
  top: 40px;
  left: 54px;
  border-radius: 10px;
}

.wing {
  width: 50px;
  height: 20px;
  background: rgba(255,255,255,0.4);
  position: absolute;
  top: 10px;
  border-radius: 50%;
  animation: flap 0.15s infinite alternate;
}

.wing.left { left: 0; }
.wing.right { right: 0; }

@keyframes flap {
  from { transform: rotate(0deg); }
  to { transform: rotate(15deg); }
}

.leg {
  width: 40px;
  height: 2px;
  background: black;
  position: absolute;
}

.l1 { top: 60px; left: 0; transform: rotate(30deg); }
.l2 { top: 70px; left: 0; transform: rotate(10deg); }
.l3 { top: 80px; left: 0; transform: rotate(-10deg); }

.r1 { top: 60px; right: 0; transform: rotate(-30deg); }
.r2 { top: 70px; right: 0; transform: rotate(-10deg); }
.r3 { top: 80px; right: 0; transform: rotate(10deg); }

/* apology box */
.container {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.2);
  padding: 20px;
  border-radius: 20px;
  max-width: 350px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  color: white;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

#msg {
  display: none;
  margin-top: 10px;
}

/* confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>

</head>

<body>

<!-- floating hearts -->

<script>
for(let i=0;i<25;i++){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random()*100 + "vw";
  h.style.fontSize = (14 + Math.random()*20) + "px";
  h.style.animationDuration = (3 + Math.random()*4) + "s";
  document.body.appendChild(h);
}
</script>

<!-- MOSQUITO -->

<div class="mosquito" id="mosquito">
  <div class="wing left"></div>
  <div class="wing right"></div>
  <div class="body"></div>

  <div class="leg l1"></div>
  <div class="leg l2"></div>
  <div class="leg l3"></div>
  <div class="leg r1"></div>
  <div class="leg r2"></div>
  <div class="leg r3"></div>

  <img src="me.jpg" class="face">
</div>

<!-- APOLOGY -->

<div class="container">
  <h2>Catch me first 😭🦟</h2>

<button onclick="show()">I caught you 😤</button>

  <div id="msg">
    <p>Okay fine… you caught me 😭</p>
    <p>I know i have hurt you a lot and was showing too much cock…</p>
    <p>But i swear im not taking you for granted</p>
    <p>You mean too much to me for me to act like that again. ❤️</p>
    <p><b>Please forgive me 🥺</b></p>
  </div>
</div>

<script>
const mosquito = document.getElementById("mosquito");

/* movement */
function moveMosquito(){
  let x = Math.random() * (window.innerWidth - 120);
  let y = Math.random() * (window.innerHeight - 120);

  mosquito.style.left = x + "px";
  mosquito.style.top = y + "px";
}
setInterval(moveMosquito, 1500);

/* show message + confetti */
function show(){
  document.getElementById("msg").style.display = "block";

  for(let i=0;i<80;i++){
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = `hsl(${Math.random()*360},100%,70%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
</script>

</body>
</html>
