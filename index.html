<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry 😭❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(-45deg, #1a1a1a, #2b2b2b, #ff4d6d, #1a1a1a);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* canvas */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* hearts */
.heart {
  position: absolute;
  font-size: 18px;
  animation: float 6s linear infinite;
  opacity: 0.6;
}
@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* scene */
.scene {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  z-index: 2;
}

.girl {
  width: 200px;
  height: 200px;
  border-radius: 20px;
  object-fit: cover;
}

/* bite */
.bite {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  border-radius: 50%;
  top: 80px;
  left: 120px;
  opacity: 0;
}

.aah {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-weight: bold;
  opacity: 0;
}

/* mosquito */
.mosquito {
  position: absolute;
  width: 100px;
  height: 100px;
  transition: 1.2s linear;
  z-index: 3;
}

.face {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  position: absolute;
  top: 18px;
  left: 25px;
}

.body {
  width: 10px;
  height: 50px;
  background: #222;
  position: absolute;
  top: 35px;
  left: 45px;
}

.leg {
  width: 35px;
  height: 2px;
  background: #222;
  position: absolute;
}

.l1 { top: 50px; left: 0; transform: rotate(30deg); }
.l2 { top: 60px; left: 0; transform: rotate(10deg); }
.l3 { top: 70px; left: 0; transform: rotate(-10deg); }

.r1 { top: 50px; right: 0; transform: rotate(-30deg); }
.r2 { top: 60px; right: 0; transform: rotate(-10deg); }
.r3 { top: 70px; right: 0; transform: rotate(10deg); }

/* wings */
.wing {
  width: 40px;
  height: 18px;
  background: rgba(255,255,255,0.3);
  position: absolute;
  top: 8px;
  border-radius: 50%;
  animation: flap 0.15s infinite alternate;
}
.wing.left { left: 0; }
.wing.right { right: 0; }

@keyframes flap {
  from { transform: rotate(0deg); }
  to { transform: rotate(15deg); }
}

/* UI */
.container {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 360px;
  backdrop-filter: blur(20px);
  background: rgba(0, 0, 0, 0.75);
  padding: 18px;
  border-radius: 20px;
  text-align: center;
  color: white;
  z-index: 3;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg, #ff4d6d, #ff85a1);
  color: white;
}

#msg { display: none; margin-top: 10px; }

#msg b {
  color: #ff4d6d;
  text-shadow: 0 0 10px #ff4d6d;
}
</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="scene">
  <img src="her.jpg" class="girl">
  <div class="bite" id="bite"></div>
  <div class="aah" id="aah">aah 😭</div>
</div>

<div class="mosquito" id="mosquito">
  <div class="wing left"></div>
  <div class="wing right"></div>
  <div class="body"></div>

  <div class="leg l1"></div>
  <div class="leg l2"></div>
  <div class="leg l3"></div>
  <div class="leg r1"></div>
  <div class="leg r2"></div>
  <div class="leg r3"></div>

  <img src="me.jpg" class="face">
</div>

<div class="container">
  <h2>Catch me first 😭🦟</h2>
  <button onclick="show()">I caught you 😤</button>

  <div id="msg">
    <p>Okay fine… you caught me 😭</p>
    <p>I know I’ve been low effort…</p>
    <p>But you really mean a lot to me ❤️</p>
    <p><b>Please forgive me 🥺</b></p>
  </div>
</div>

<script>
const mosquito = document.getElementById("mosquito");
const bite = document.getElementById("bite");
const aah = document.getElementById("aah");

let prevX = 0;
let prevY = 0;

function animate(){
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;

  let dx = x - prevX;
  let dy = y - prevY;
  let angle = Math.atan2(dy, dx) * 180/Math.PI;

  mosquito.style.left = x + "px";
  mosquito.style.top = y + "px";
  mosquito.style.transform = "rotate(" + angle + "deg)";

  prevX = x;
  prevY = y;

  setTimeout(()=>{
    mosquito.style.left = "55%";
    mosquito.style.top = "40%";

    setTimeout(()=>{
      bite.style.opacity = 1;
      aah.style.opacity = 1;

      setTimeout(()=>{
        bite.style.opacity = 0;
        aah.style.opacity = 0;
      },800);

    },400);

  },1200);
}

setInterval(animate, 3000);

function show(){
  document.getElementById("msg").style.display = "block";
}
</script>

</body>
</html>
