<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry 😭❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* mosquito */
.mosquito {
  position: absolute;
  width: 100px;
  transition: 1.5s linear;
}

.mosquito img {
  width: 100%;
  border-radius: 50%;
}

/* wings */
.wings {
  position: absolute;
  top: -10px;
  left: -25px;
  width: 150px;
  height: 50px;
  background: rgba(0,0,0,0.1);
  border-radius: 50%;
  animation: flap 0.15s infinite alternate;
}

@keyframes flap {
  from { transform: rotate(0deg); }
  to { transform: rotate(15deg); }
}

/* message box */
.container {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 20px;
  border-radius: 20px;
  max-width: 350px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

#msg {
  display: none;
  margin-top: 10px;
}
</style>

</head>

<body>

<!-- mosquito -->

<div class="mosquito" id="mosquito">
  <div class="wings"></div>
  <img src="your-image.jpg" alt="me">
</div>

<!-- apology box -->

<div class="container">
  <h2>Catch me first 😭🦟</h2>
  <button onclick="show()">I caught you 😤</button>

  <div id="msg">
    <p>I know I’ve been low effort…</p>
    <p>But you really mean a lot to me.</p>
    <p>I’ll do better, I promise ❤️</p>
    <p><b>Please forgive me 🥺</b></p>
  </div>
</div>

<script>
const mosquito = document.getElementById("mosquito");

/* random movement */
function moveMosquito(){
  let x = Math.random() * (window.innerWidth - 120);
  let y = Math.random() * (window.innerHeight - 120);

  mosquito.style.left = x + "px";
  mosquito.style.top = y + "px";
}

setInterval(moveMosquito, 1500);

/* click apology */
function show(){
  document.getElementById("msg").style.display = "block";
}
</script>

</body>
</html>
