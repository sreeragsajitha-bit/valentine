<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Months With You ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #ff6a88, #ff99ac, #ff758c, #ffb3c6);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* floating hearts */
.heart {
  position: absolute;
  font-size: 18px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* card */
.container {
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.2);
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  max-width: 420px;
  color: white;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: fadeIn 1s ease;
}

h1 {
  margin-bottom: 10px;
}

button {
  margin-top: 15px;
  padding: 12px 25px;
  border: none;
  border-radius: 15px;
  background: linear-gradient(45deg, #ff4d6d, #ff85a1);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

/* text area */
#text {
  margin-top: 20px;
  text-align: left;
  white-space: pre-line;
  min-height: 120px;
}

/* glow */
.love {
  text-align: center;
  font-weight: bold;
  margin-top: 10px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px white; }
  to { text-shadow: 0 0 20px #fff; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>

</head>

<body>

<div class="container">
  <h1>Happy 10 Months ❤️</h1>
  <p>Still choosing you. Always.</p>

<button onclick="start()">Open this 💌</button>

  <div id="text"></div>
</div>

<script>
/* floating hearts */
for(let i=0;i<25;i++){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random()*100 + "vw";
  h.style.fontSize = (14 + Math.random()*20) + "px";
  h.style.animationDuration = (3 + Math.random()*4) + "s";
  document.body.appendChild(h);
}

/* typing message */
const msg = `These 10 months with you...

weren’t perfect... but they were real.

Every laugh, every fight, every moment...

I still choose you.

You’ve become my comfort,
my happiness,
and someone I never want to lose.

And this isn’t just 10 months for me...

I want many more with you 
I Love You Thanuu ❤️`;

let i = 0;

function start(){
  document.getElementById("text").innerHTML = "";
  i = 0;
  type();
  confetti();
}

function type(){
  if(i < msg.length){
    document.getElementById("text").innerHTML += msg.charAt(i);
    i++;
    setTimeout(type, 30);
  } else {
    document.getElementById("text").innerHTML += '<p class=\"love\">I love you ❤️</p>';
  }
}

/* confetti */
function confetti(){
  for(let i=0;i<80;i++){
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = `hsl(${Math.random()*360},100%,70%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
</script>

</body>
</html>
